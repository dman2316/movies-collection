<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Collection</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Personal Library</p>
          <h1>Movie Collection</h1>
        </div>
        <button id="clearAllBtn" class="danger-btn" type="button">Clear All</button>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <h2>Add Movie</h2>
          <form id="movieForm">
            <div class="field-row">
              <label>
                <span>Title</span>
                <input id="title" name="title" type="text" placeholder="e.g. Inception" required />
              </label>
            </div>

            <div class="field-row two-col">
              <label>
                <span>Director</span>
                <input id="director" name="director" type="text" placeholder="Christopher Nolan" />
              </label>

              <label>
                <span>Genre</span>
                <input id="genre" name="genre" type="text" placeholder="Sci-Fi" />
              </label>
            </div>

            <div class="field-row two-col">
              <label>
                <span>Year</span>
                <input id="year" name="year" type="number" min="1888" max="2100" placeholder="2024" />
              </label>

              <label>
                <span>Rating</span>
                <input id="rating" name="rating" type="number" min="0" max="10" step="0.1" placeholder="8.5" />
              </label>
            </div>

            <label class="checkbox-wrap">
              <input id="watched" name="watched" type="checkbox" />
              <span>Watched</span>
            </label>

            <button class="primary-btn" type="submit">Save Movie</button>
          </form>
        </section>

        <section class="panel list-panel">
          <div class="toolbar">
            <h2>My Movies</h2>
            <div class="controls">
              <input id="searchInput" type="search" placeholder="Search movies..." aria-label="Search movies" />
              <select id="filterSelect" aria-label="Filter movies">
                <option value="all">All</option>
                <option value="watched">Watched</option>
                <option value="unwatched">Unwatched</option>
              </select>
            </div>
          </div>

          <div class="stats" id="stats">
            <div><strong id="totalCount">0</strong><span>Total</span></div>
            <div><strong id="watchedCount">0</strong><span>Watched</span></div>
            <div><strong id="averageRating">0.0</strong><span>Avg Rating</span></div>
          </div>

          <div id="movieList" class="movie-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <template id="movieItemTemplate">
      <article class="movie-card">
        <div class="movie-head">
          <div>
            <h3 class="movie-title"></h3>
            <p class="movie-meta"></p>
          </div>
          <span class="badge"></span>
        </div>

        <div class="movie-details">
          <span class="rating-pill"></span>
          <button class="toggle-btn" type="button"></button>
          <button class="delete-btn" type="button">Delete</button>
        </div>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
