<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Collection</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Movie Tracker</p>
          <h1>Movie Collection</h1>
        </div>
        <button id="clearAllBtn" class="danger-btn" type="button">Clear All</button>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <h2>Search & Add</h2>
          <form id="searchForm">
            <label>
              <span>Search Movie Title</span>
              <input id="searchTitle" name="searchTitle" type="text" placeholder="e.g. Inception" />
            </label>
            <button class="primary-btn" type="submit">Search Online</button>
          </form>

          <div id="searchResults" class="search-results"></div>

          <hr class="divider" />

          <h3>Add Manually</h3>
          <form id="movieForm">
            <label>
              <span>Movie Title</span>
              <input id="title" name="title" type="text" placeholder="e.g. Inception" required />
            </label>

            <label class="checkbox-wrap">
              <input id="watched" name="watched" type="checkbox" />
              <span>Already watched</span>
            </label>

            <button class="primary-btn" type="submit">Add Movie</button>
          </form>
        </section>

        <section class="panel list-panel">
          <div class="toolbar">
            <h2>My Movies</h2>
            <div class="controls">
              <input id="searchInput" type="search" placeholder="Search by title..." aria-label="Search by title" />
              <select id="filterSelect" aria-label="Filter movies">
                <option value="all">All</option>
                <option value="watched">Watched</option>
                <option value="unwatched">Unwatched</option>
              </select>
            </div>
          </div>

          <div class="stats" id="stats">
            <div><strong id="totalCount">0</strong><span>Total</span></div>
            <div><strong id="watchedCount">0</strong><span>Watched</span></div>
            <div><strong id="averageRating">0</strong><span>In Collection</span></div>
          </div>

          <div id="movieList" class="movie-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <template id="movieItemTemplate">
      <article class="movie-card">
        <div class="movie-head">
          <div>
            <h3 class="movie-title"></h3>
            <p class="movie-meta"></p>
          </div>
          <span class="badge"></span>
        </div>

        <div class="movie-details">
          <button class="toggle-btn" type="button"></button>
          <button class="delete-btn" type="button">Delete</button>
        </div>
      </article>
    </template>

    <template id="searchResultTemplate">
      <div class="search-result-card">
        <div class="result-info">
          <h4 class="result-title"></h4>
          <p class="result-year"></p>
        </div>
        <button class="add-result-btn" type="button">Add to Collection</button>
      </div>
    </template>

    <script src="script.js"></script>
  </body>
</html>
